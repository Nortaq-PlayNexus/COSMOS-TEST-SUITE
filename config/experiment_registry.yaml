experiments:
- exp_id: EXP-001
  name: Cosmic web and large-scale structure vs Lambda CDM
  description: Reconstruct the cosmic web from a galaxy survey, compute the power
    spectrum and two-point correlation function, and compare against Lambda CDM simulations.
    Measures the homogeneity scale.
  question_key: large_scale_homogeneity
  order: 1
  status: data_awaiting
  scores:
    data_availability: 0.8
    theoretical_importance: 0.9
    observational_leverage: 0.8
    reproducibility: 0.9
    computational_feasibility: 0.9
    falsifiability: 0.8
    potential_impact: 0.8
  definition:
    id: EXP-001
    name: Cosmic web and large-scale structure vs Lambda CDM
    hypothesis: The distribution of galaxies on large scales is consistent with the
      Lambda CDM prediction for the matter power spectrum and two-point correlation
      function.
    null_model: 'No structure / white noise: galaxies distributed uniformly with Poisson
      shot noise.'
    alternative_models:
    - 'Lambda CDM (standard model): P(k) from linear theory with transfer function;
      nonlinear corrections.'
    - Power-law power spectrum with different tilt (n_s != 0.965).
    - Cutoff at large scales (inflation alternative).
    assumptions:
    - Galaxy bias is scale-independent on the scales measured.
    - Redshift-space distortions are modeled or mitigated.
    - Selection function is known from the survey.
    datasets:
    - DESI DR1
    - SDSS DR16
    - Euclid EDR (simulated)
    preprocessing:
    - Redshift-distance conversion to 3D coordinates.
    - Angular mask application.
    - Weighting for completeness and selection effects.
    - Baryon acoustic oscillation smoothing.
    prediction: P(k) peaks at k ~ 0.02 h/Mpc (BAO scale); the two-point correlation
      function shows a BAO peak at r ~ 100 h^-1 Mpc; the universe becomes homogeneous
      for R > ~100 h^-1 Mpc.
    statistical_test: Chi-square goodness-of-fit of measured P(k) to Lambda CDM prediction;
      Kolmogorov-Smirnov test of void size distribution against simulations; bootstrap
      confidence intervals on the homogeneity scale.
    expected_result: Measured power spectrum consistent with Lambda CDM within measurement
      errors; homogeneity scale R_h ~ 70-100 h^-1 Mpc.
    falsification_condition: Measured P(k) or correlation function deviates from Lambda
      CDM by > 5 sigma after accounting for systematics and look-elsewhere effects;
      homogeneity not achieved by R = 250 h^-1 Mpc.
    uncertainty:
    - Measurement (shot noise, survey geometry).
    - Modeling (nonlinear clustering, redshift-space distortions).
    - Cosmic variance on the largest scales.
    systematic_errors:
    - Galaxy selection / completeness biases.
    - Redshift errors and peculiar velocities.
    - Evolution of the sample with redshift.
    - Baryonic effects on small-scale clustering.
    result: null
    confidence: null
    reproducibility:
      random_seed: 42
      software_version: 0.1.0
      analysis_version: v1
    status: data_awaiting
