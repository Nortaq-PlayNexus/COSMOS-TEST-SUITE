[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-test-suite"
version = "0.1.0.dev0"
description = "An Independent Computational Observatory for Testing the Biggest Questions in Cosmology and Fundamental Physics"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "COSMOS", email = "cosmos@example.com" }
]
license = { text = "GPL-3.0-only" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "astropy>=6.0",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "xarray>=2024.6",
    "h5py>=3.11",
    "pyarrow>=17.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "httpx>=0.27",
    "networkx>=3.3",
    "sympy>=1.13",
    "numba>=0.60",
    "pooch>=1.8",
    "click>=8.1",
    "tqdm>=4.66",
    "rich>=13.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "emcee>=3.1",
    "corner>=2.2",
    "arviz>=0.21",
    "pycosat>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.0",
]

[project.scripts]
cosmos = "cosmos.cli:main"

[tool.setuptools.packages.find]
include = ["cosmos*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
